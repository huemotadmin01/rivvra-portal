# Deploys to www.rivvra.com via GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Sentry frontend DSN — injected at build time (Vite inlines it).
          # No-op if the secret is unset, so this is safe before you add it.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # GA4 + Google Ads — repository VARIABLES (Settings → Secrets and
          # variables → Actions → Variables), not secrets: these IDs are
          # public in the served page anyway. All no-op while unset. See
          # src/lib/analytics.js for what each one does.
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_ADS_CONVERSION_ID: ${{ vars.ADS_CONVERSION_ID }}
          VITE_ADS_SIGNUP_LABEL: ${{ vars.ADS_SIGNUP_LABEL }}
          VITE_ADS_PURCHASE_LABEL: ${{ vars.ADS_PURCHASE_LABEL }}

      - name: Copy 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      # Top-level public routes (/pricing, /signup, /login, …) get a real
      # <route>.html so Pages answers 200 instead of the 404-status SPA
      # fallback. Google Ads disapproves 404 destinations. See
      # public-prerender.txt for the why and the list.
      - name: Materialise public marketing routes so Pages returns 200
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r line || [ -n "$line" ]; do
            route="$(printf '%s' "${line%%#*}" | tr -d '[:space:]' | sed 's#^/##')"
            if [ -n "$route" ]; then
              case "$route" in
                */*) echo "refusing nested route '$route' — use careers-prerender.txt style directories"; exit 1 ;;
              esac
              cp dist/index.html "dist/$route.html"
              echo "  prerendered /$route"
              count=$((count + 1))
            fi
          done < public-prerender.txt
          echo "materialised $count public route(s)"
          test "$count" -gt 0

      # Pages has no rewrite config, so 404.html is what serves every unmatched
      # path — and it comes back with a 404 status. The app still renders, but
      # crawlers and link checkers stop there. Putting a real file at the
      # careers landing paths makes Pages answer those with a 200; the SPA then
      # boots and routes exactly as before. See careers-prerender.txt.
      - name: Materialise careers landing pages so Pages returns 200
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r line || [ -n "$line" ]; do
            slug="$(printf '%s' "${line%%#*}" | tr -d '[:space:]')"
            if [ -n "$slug" ]; then
              mkdir -p "dist/careers/$slug"
              cp dist/index.html "dist/careers/$slug/index.html"
              echo "  prerendered /careers/$slug"
              count=$((count + 1))
            fi
          done < careers-prerender.txt
          echo "materialised $count careers landing page(s)"
          test "$count" -gt 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Pages artifacts are only needed for the minutes between build
          # and deploy — the 90-day default retention piled up one ~10-50MB
          # artifact per deploy and filled the account's 0.5GB Actions
          # storage quota (GitHub alert 2026-07-15).
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
