<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rivvra — The all-in-one staffing platform. Outreach, timesheets, CRM, ATS, payroll, e-signatures, and more. Built for staffing agencies." />
    <meta name="theme-color" content="#020617" />
    <meta property="og:title" content="Rivvra — All-in-one staffing platform" />
    <meta property="og:description" content="Fourteen modular apps for staffing agencies: Outreach, ESS, CRM, ATS, Payroll, Employee, Contacts, Sign, To-Do, Invoicing, Expenses, Incentive, Documents, and Knowledge Base." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rivvra.com" />
    <link rel="canonical" href="https://www.rivvra.com" />
    <title>Rivvra — All-in-one staffing platform</title>
    <!-- Redirect hash-based URLs to clean paths (backward compat for extension + old bookmarks) -->
    <script>
      (function () {
        var h = window.location.hash;
        if (h && h.startsWith('#/')) {
          var path = h.slice(1);
          var search = window.location.search || '';
          window.location.replace(window.location.origin + path + search);
        }
      })();
    </script>
    <!-- Theme, resolved BEFORE React mounts.

         ThemeToggle writes `data-theme` on <html>, but it only mounts inside
         the v2 app shell — several seconds into a cold load on a slow API.
         Until then <html> carries no theme, every ds token falls back to its
         dark default, and anything painted in that window (notably
         ProtectedRoute's auth spinner) shows dark chrome to a light-theme
         user. That is the reload flash.

         Must stay INLINE and in <head>: an external or deferred script runs
         after first paint, which is exactly the window being closed. Mirrors
         ThemeToggle's own resolution order — stored choice, else OS
         preference, else dark — and the key must stay in step with
         `KEY` in ThemeToggle.jsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rivvra.theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Boot splash. Lives INSIDE #root so React's first render replaces it —
         createRoot().render() clears container children, so there is no JS
         handoff to coordinate and no way for it to linger over the app.

         Colors are literal (the token stylesheets have not loaded yet) and
         keyed on the data-theme the head script just stamped. They are the v2
         --bg values (#080B10 / #FAF8F4), NOT legacy #020617 — the whole point
         is that the first painted frame already looks like the v2 app in the
         user's own theme. The ring matches ProtectedRoute's and ShellSwitch's
         spinners exactly, so boot -> auth -> org reads as one continuous
         loading state instead of three different screens. -->
    <style>
      #root { min-height: 100vh; background: #080B10; }
      html[data-theme='light'] #root { background: #FAF8F4; }
      .boot-splash {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
      }
      .boot-splash .ring {
        width: 48px; height: 48px; border-radius: 9999px;
        border: 4px solid rgba(34, 197, 94, 0.3); border-top-color: #22C55E;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root"><div class="boot-splash"><div class="ring"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
